<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jornada 2080: O Futuro Urbano</title>
</head>
<body>
    <div class="caixa-principal">
        <div class="tela-inicial">
            <h1>Jornada 2080</h1>
            <p class="texto-introdutorio">
                O ano é 2080. A linha entre a humanidade e a inteligência artificial tornou-se tênue. Suas escolhas moldarão o destino das metrópoles, a ética cibernética e a sobrevivência do planeta. Preparado para decidir o futuro?
            </p>
            <button class="iniciar-btn">Iniciar Missão</button>
        </div>

        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>
        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
            <button class="iniciar-btn" onclick="iniciaJogo()">Jogar Novamente</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
